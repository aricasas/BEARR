[package]
name = "bearr"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145" }
bytemuck = { version = "1.24.0", features = ["alloc_uninit", "derive", "extern_crate_alloc", "min_const_generics", "zeroable_maybe_uninit"] }
fastrand = "2.3.0"
bit-vec = "0.8.0"
csv = "1.4.0"
aligned-vec = "0.6.4"
indicatif = "0.18.3"
clap = { version = "4.5.53", features = ["derive"] }
bearr-error = { version = "0.1.0", path = "../bearr-error" }
futures = "0.3.32"
flume = "0.12.0"
io-uring = "0.7.11"
libc = "0.2.184"
hashbrown = "0.17.0"
tokio = { version = "1.52.3", features = ["sync", "time", "macros", "rt"] }

[[bin]]
name = "experiments"
path = "src/experiments.rs"

[features]
default = []
binary_search = []
keep_test_files = []
uniform_bits = []

[dev-dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
